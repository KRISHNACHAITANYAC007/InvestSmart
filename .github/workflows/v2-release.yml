name: V2 release candidate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate and package with isolated containers
        run: node scripts/build-v2-release.mjs --require-containers
      - uses: actions/upload-artifact@v4
        with:
          name: investsmart-v2-candidate
          path: |
            target/releases/*.tar.gz
            target/releases/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
