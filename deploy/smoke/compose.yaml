# Isolated synthetic acceptance only. Never use these settings for deployment.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: investsmart_release_synthetic
      MYSQL_USER: release_fixture
      MYSQL_PASSWORD: ${V2_SMOKE_DB_PASSWORD:?Generated by smoke runner}
      MYSQL_ROOT_PASSWORD: ${V2_SMOKE_ROOT_PASSWORD:?Generated by smoke runner}
    ports: ["127.0.0.1::3306"]
    volumes:
      - ../mysql-init:/docker-entrypoint-initdb.d:ro
      - database:/var/lib/mysql
    # Desktop does not publish host ports on an internal-only network.
    # This synthetic database needs loopback access for the host Maven checks.
    networks: [database, edge]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 3s
      timeout: 3s
      retries: 60
  backend:
    build:
      context: ${V2_SMOKE_CONTEXT:?Generated by smoke runner}
      dockerfile: deploy/Dockerfile.backend.release
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/investsmart_release_synthetic?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: release_fixture
      DB_PASSWORD: ${V2_SMOKE_DB_PASSWORD}
      JWT_SECRET: ${V2_SMOKE_JWT}
      SECURITY_ENCRYPTION_KEY: ${V2_SMOKE_ENCRYPTION}
      UPSTOX_API_TOKEN: synthetic-no-provider-access
      PUBLIC_URL: https://localhost:18443
      CORS_ORIGINS: https://localhost:18443
      SMTP_HOST: mail.invalid
      SMTP_USERNAME: synthetic
      SMTP_PASSWORD: synthetic
      MAIL_FROM: sender@example.invalid
      INVESTSMART_IPO_SCHEDULER_ENABLED: "false"
      INVESTSMART_OPTIONS_SCHEDULER_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [database, edge]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 3s
      timeout: 3s
      retries: 60
  web:
    build:
      context: ${V2_SMOKE_CONTEXT:?Generated by smoke runner}
      dockerfile: deploy/Dockerfile.web.release
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    ports: ["127.0.0.1:18443:18443"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
volumes:
  database:
  certificates:
networks:
  database:
    internal: true
  edge:
