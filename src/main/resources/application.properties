spring.application.name=InvestSmart


upstox.api.token=${UPSTOX_API_TOKEN:}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

investsmart.public-url=${PUBLIC_URL:http://localhost:5173}
investsmart.ai.url=${AI_CHAT_URL:}
investsmart.ai.model=${AI_CHAT_MODEL:}
investsmart.ai.api-key=${AI_CHAT_API_KEY:}
investsmart.news.rss-url=${NEWS_RSS_URL:}
investsmart.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
investsmart.mail.from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# V3 remains deferred; enable only for a separate reviewed release.
investsmart.features.learning-enabled=false
